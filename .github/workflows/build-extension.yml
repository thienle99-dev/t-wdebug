name: Build Chrome extension

on:
  push:
    branches-ignore: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check capture architecture
        run: npm run check:capture-architecture

      - name: Build extension
        run: npm run build

      - name: Package and verify extension
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          build_timestamp="$(date -u +'%Y%m%d-%H%M%S')"
          artifact_name="api-lens-v${version}-${build_timestamp}"
          zip_name="${artifact_name}.zip"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${zip_name}" >> "$GITHUB_OUTPUT"
          (cd dist && zip -q -r "${RUNNER_TEMP}/${zip_name}" .)
          unzip -Z1 "${RUNNER_TEMP}/${zip_name}" | grep -Fxq 'manifest.json'
          unzip -Z1 "${RUNNER_TEMP}/${zip_name}" | grep -Fxq 'popup.html'
          unzip -Z1 "${RUNNER_TEMP}/${zip_name}" | grep -Fxq 'panel.html'
          unzip -Z1 "${RUNNER_TEMP}/${zip_name}" | grep -Fxq 'devtools.html'
          unzip -Z1 "${RUNNER_TEMP}/${zip_name}" | grep -Fxq 'assets/service-worker.js'
          unzip -Z1 "${RUNNER_TEMP}/${zip_name}" | grep -Fxq 'icons/icon32.png'

      - name: Upload verified extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/${{ steps.package.outputs.zip_name }}
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download verified extension ZIP
        uses: actions/download-artifact@v4
        with:
          pattern: api-lens-v*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release and upload extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/*.zip --title "$GITHUB_REF_NAME" --generate-notes
